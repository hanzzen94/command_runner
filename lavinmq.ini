[main]
tls_cert = /etc/lavinmq/certs/lavinmq.crt
tls_key = /etc/lavinmq/certs/lavinmq.key
default_user_only_loopback = true

[amqp]
bind = 0.0.0.0
port = 5672
tls_port = 5671

[sni:lavinmq]
tls_cert = /etc/lavinmq/certs/lavinmq.crt
tls_key = /etc/lavinmq/certs/lavinmq.key
tls_verify_peer = true
tls_ca_cert = /etc/lavinmq/certs/ca.crt

[sni:localhost]
tls_cert = /etc/lavinmq/certs/lavinmq.crt
tls_key = /etc/lavinmq/certs/lavinmq.key
tls_verify_peer = true
tls_ca_cert = /etc/lavinmq/certs/ca.crt
