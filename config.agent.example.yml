agent_id: "server-01"

amqp:
  url: "amqp://agent:secretpass@localhost:5672"
  task_queue: "tasks"
  result_queue: "results"
  poll_interval: 5
  # For TLS with mTLS (amqps://), uncomment and set the following:
  # ca: certs/ca.crt            # CA cert to verify the broker
  # cert: certs/agent-01.crt    # per-agent client cert (CN must match agent_id)
  # key: certs/agent-01.key     # per-agent private key
  # Generate per-agent certs with: ./certs/generate-agent.sh <agent_id>

limits:
  output_bytes: 1048576
  default_timeout: 30

workloads:
  - name: echo
    command: ["/bin/echo", "{message}"]
    params:
      - name: message
        required: true
        pattern: "^[a-zA-Z0-9 ._-]+$"
    timeout: 5

  - name: disk_usage
    command: ["/bin/df", "-h"]
    timeout: 10

  - name: chef_client
    command: ["sudo", "chef-client", "-o", "recipe[{recipe}]"]
    params:
      - name: recipe
        required: true
        pattern: "^[a-zA-Z0-9_:-]+$"
    timeout: 1800
    cwd: /var/chef
