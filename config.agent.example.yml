agent_id: "server-01"

amqp:
  url: "amqp://agent:secretpass@localhost:5672"
  task_queue: "tasks"
  result_queue: "results"
  poll_interval: 5
  # ca: certs/ca.crt  # uncomment for amqps:// TLS verification

limits:
  output_bytes: 1048576
  default_timeout: 30

workloads:
  - name: echo
    command: ["/bin/echo", "{message}"]
    params:
      - name: message
        required: true
        pattern: "^[a-zA-Z0-9 ._-]+$"
    timeout: 5

  - name: disk_usage
    command: ["/bin/df", "-h"]
    timeout: 10

  - name: chef_client
    command: ["sudo", "chef-client", "-o", "recipe[{recipe}]"]
    params:
      - name: recipe
        required: true
        pattern: "^[a-zA-Z0-9_:-]+$"
    timeout: 1800
    cwd: /var/chef
