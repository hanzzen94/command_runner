listen: "127.0.0.1:8443"

tls:
  cert: certs/server.crt
  key: certs/server.key
  ca: certs/ca.crt

allowed_clients:
  - ci-bot

limits:
  request_body_bytes: 65536
  output_bytes: 1048576
  default_timeout: 30
  rate_per_minute: 60

workloads:
  - name: echo
    command: ["/bin/echo", "{message}"]
    params:
      - name: message
        required: true
        pattern: "^[a-zA-Z0-9 ._-]+$"
    timeout: 5

  - name: disk_usage
    command: ["/bin/df", "-h"]
    timeout: 10

  - name: slow_task
    command: ["/bin/sleep", "10"]
    timeout: 2

  - name: restricted
    command: ["/bin/echo", "restricted endpoint"]
    allowed_clients:
      - deploy-worker
    timeout: 5

  - name: chef_client
    command: ["sudo", "chef-client", "-o", "recipe[{recipe}]"]
    params:
      - name: recipe
        required: true
        pattern: "^[a-zA-Z0-9_:-]+$"
    allowed_clients:
      - deploy-worker
    timeout: 1800
    cwd: /var/chef
