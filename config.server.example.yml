listen: "0.0.0.0:8443"

tls:
  cert: certs/server.crt
  key: certs/server.key
  ca: certs/ca.crt

amqp:
  url: "amqps://CHANGE_ME:CHANGE_ME@localhost:5671"
  # Run ./scripts/setup-lavinmq-users.sh <server_cloud_id> to create the amqp-server
  # user and get the generated amqps:// URL with credentials. Paste it here.
  task_queue: "tasks"
  result_queue: "results"
  poll_interval: 5
  # For TLS with mTLS (amqps://), uncomment and set the following:
  # ca: certs/ca.crt          # CA cert to verify the broker
  # cert: certs/amqp-server.crt  # client cert for mTLS authentication
  # key: certs/amqp-server.key   # private key for mTLS authentication

allowed_clients:
  - ci-bot

limits:
  request_body_bytes: 65536
  rate_per_minute: 60

results:
  url: "postgres://command_runner:secretpass@localhost:5432/command_runner"
  results_limit: 100
